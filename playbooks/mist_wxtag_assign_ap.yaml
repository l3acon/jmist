---
- name: Assign APs to WxTag label by name
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Validate all AP MACs and convert to unique device IDs
      ansible.builtin.set_fact:
        ap_ids: "{{ ap_macs | default(ap_mac | default('')) | l3acon.jmist.macs_to_ap_ids }}"

    - name: Show AP device IDs to assign
      ansible.builtin.debug:
        msg: "Assigning {{ ap_ids | length }} AP(s): {{ ap_ids }}"

    - name: Look up WxTag by name
      l3acon.jmist.label_info:
        api_token: "{{ mist_token }}"
        base_url: "{{ mist_base_url | default('https://api.mist.com') }}"
        org_id: "{{ org_id }}"
        name: "{{ tag_name }}"
      register: tag

    - name: Show label info
      ansible.builtin.debug:
        var: tag.label

    - name: Update WxTag with AP device IDs
      l3acon.jmist.mist_org_wxtags:
        api_token: "{{ mist_token }}"
        base_url: "{{ mist_base_url | default('https://api.mist.com') }}"
        org_id: "{{ org_id }}"
        wxtag_id: "{{ tag.label.id }}"
        state: present
        values_mode: merge
        values: "{{ ap_ids }}"
      register: update_result

    - name: Show update result
      ansible.builtin.debug:
        var: update_result
