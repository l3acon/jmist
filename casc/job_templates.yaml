---
controller_templates:
  - name: "Mist - Assign AP to WxTag"
    description: Assign one or more access points to a WxTag label by AP MAC addresses and tag name
    organization: Default
    project: Juniper Mist Collection
    playbook: playbooks/mist_wxtag_assign_ap.yaml
    inventory: Localhost
    credentials:
      - Mist API - Lab
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: AP MAC Addresses
          question_description: "MAC addresses of the APs to assign, one per line or separated by commas or spaces (e.g. a8:53:7d:89:7e:7d)"
          required: true
          type: textarea
          variable: ap_macs
          max: 65536
          default: ""
        - question_name: Tag Name
          question_description: "WxTag label to assign all listed APs to"
          required: true
          type: multiplechoice
          variable: tag_name
          choices:
            - matt-label1
            - matt-label2
            - another-example-label
          default: ""

  - name: "Mist - Remove AP from WxTag"
    description: Remove one or more access points from a WxTag label by AP MAC addresses and tag name
    organization: Default
    project: Juniper Mist Collection
    playbook: playbooks/mist_wxtag_remove_ap.yaml
    inventory: Localhost
    credentials:
      - Mist API - Lab
    survey_enabled: true
    survey_spec:
      name: ""
      description: ""
      spec:
        - question_name: AP MAC Addresses
          question_description: "MAC addresses of the APs to remove, one per line or separated by commas or spaces (e.g. a8:53:7d:89:7e:7d)"
          required: true
          type: textarea
          variable: ap_macs
          max: 65536
          default: ""
        - question_name: Tag Name
          question_description: "WxTag label to remove all listed APs from"
          required: true
          type: multiplechoice
          variable: tag_name
          choices:
            - matt-label1
            - matt-label2
            - another-example-label
          default: ""
