---
- name: Configure AAP with Juniper Mist resources
  hosts: localhost
  connection: local
  gather_facts: false
  environment:
    CONTROLLER_HOST: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') }}"
    CONTROLLER_OAUTH_TOKEN: "{{ aap_oauth_token | default('') }}"
    CONTROLLER_VERIFY_SSL: "false"
    CONTROLLER_OPTIONAL_API_URLPATTERN_PREFIX: "/api/controller/"
  vars_files:
    - credential_types.yaml
    - credentials.yaml
    - projects.yaml
    - inventories.yaml
    - job_templates.yaml
    - users.yaml

  pre_tasks:
    - name: Check configured AAP OAuth token
      ansible.builtin.uri:
        url: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/$', '') }}/api/controller/v2/me/"
        headers:
          Authorization: "Bearer {{ lookup('ansible.builtin.env', 'AAP_OAUTH_TOKEN') }}"
        validate_certs: false
        status_code: [200, 401, 403]
      register: aap_token_check
      when: lookup('ansible.builtin.env', 'AAP_OAUTH_TOKEN') | length > 0
      no_log: true

    - name: Select AAP authentication
      ansible.builtin.set_fact:
        aap_oauth_token: "{{ lookup('ansible.builtin.env', 'AAP_OAUTH_TOKEN') if aap_token_check.status | default(401) == 200 else '' }}"
      no_log: true

  tasks:
    - name: Deploy Mist resources using AAP authentication
      block:
        - name: Create temporary gateway token when needed
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/$', '') }}/api/gateway/v1/tokens/"
            method: POST
            url_username: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') }}"
            url_password: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') }}"
            force_basic_auth: true
            validate_certs: false
            body_format: json
            body:
              description: Temporary Juniper Mist deployment token
              application: null
              scope: write
            status_code: 201
          register: aap_temporary_token
          when: aap_oauth_token | length == 0
          no_log: true

        - name: Use temporary gateway token
          ansible.builtin.set_fact:
            aap_oauth_token: "{{ aap_temporary_token.json.token }}"
          when: aap_temporary_token is not skipped
          no_log: true

        - name: Configure Mist resources
          ansible.builtin.include_tasks: configure_resources.yaml

      always:
        - name: Revoke temporary gateway token
          ansible.builtin.uri:
            url: "{{ lookup('ansible.builtin.env', 'AAP_HOSTNAME') | regex_replace('/$', '') }}/api/gateway/v1/tokens/{{ aap_temporary_token.json.id }}/"
            method: DELETE
            url_username: "{{ lookup('ansible.builtin.env', 'AAP_USERNAME') }}"
            url_password: "{{ lookup('ansible.builtin.env', 'AAP_PASSWORD') }}"
            force_basic_auth: true
            validate_certs: false
            status_code: 204
          when: aap_temporary_token.json.id is defined
          no_log: true
